<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d16"/>
      <stop offset="100%" style="stop-color:#111120"/>
    </linearGradient>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,229,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="860" height="300" fill="url(#bg3)" rx="8"/>
  <rect width="860" height="300" fill="url(#grid3)" rx="8"/>
  <rect width="860" height="300" fill="none" stroke="#1e1e2e" stroke-width="1.5" rx="8"/>

  <!-- Title -->
  <text x="24" y="30" font-size="9" fill="#475569" letter-spacing="2" font-family="JetBrains Mono,monospace">CHUNKING STRATEGIES — COMPARISON</text>
  <line x1="24" y1="36" x2="836" y2="36" stroke="#1e1e2e" stroke-width="1"/>

  <!-- Column headers -->
  <text x="110" y="56" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="JetBrains Mono,monospace" letter-spacing="1">STRATEGY</text>
  <text x="310" y="56" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="JetBrains Mono,monospace" letter-spacing="1">HOW IT SPLITS</text>
  <text x="510" y="56" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="JetBrains Mono,monospace" letter-spacing="1">CHUNKS (9-topic doc)</text>
  <text x="710" y="56" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="JetBrains Mono,monospace" letter-spacing="1">BEST FOR</text>
  <line x1="24" y1="62" x2="836" y2="62" stroke="#1e2030" stroke-width="1"/>

  <!-- ─── Row 1: Paragraph ─── -->
  <rect x="24" y="68" width="812" height="64" rx="2" fill="rgba(16,185,129,0.04)" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
  <!-- strategy pill -->
  <rect x="34" y="80" width="150" height="24" rx="2" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="109" y="96" font-size="11" fill="#10b981" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700">paragraph</text>
  <text x="109" y="120" font-size="9" fill="#475569" text-anchor="middle" font-family="JetBrains Mono,monospace">✅ Recommended</text>
  <!-- how -->
  <text x="230" y="93" font-size="10" fill="#94a3b8" font-family="JetBrains Mono,monospace">Split on</text>
  <rect x="290" y="80" width="60" height="18" rx="2" fill="#0f172a" stroke="#1e2030" stroke-width="1"/>
  <text x="320" y="93" font-size="9.5" fill="#f59e0b" text-anchor="middle" font-family="JetBrains Mono,monospace">\n\n</text>
  <text x="230" y="112" font-size="9" fill="#475569" font-family="JetBrains Mono,monospace">blank lines</text>
  <!-- chunk count bar -->
  <text x="430" y="93" font-size="11" fill="#10b981" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700">~9 chunks</text>
  <rect x="380" y="100" width="100" height="6" rx="3" fill="#1e2030"/>
  <rect x="380" y="100" width="100" height="6" rx="3" fill="rgba(16,185,129,0.6)"/>
  <text x="430" y="120" font-size="9" fill="#475569" text-anchor="middle" font-family="JetBrains Mono,monospace">1 topic / chunk</text>
  <!-- best for -->
  <text x="630" y="96" font-size="10" fill="#e2e8f0" font-family="JetBrains Mono,monospace">Structured docs</text>
  <text x="630" y="114" font-size="9" fill="#475569" font-family="JetBrains Mono,monospace">with clear paragraphs</text>

  <!-- ─── Row 2: Sentence ─── -->
  <rect x="24" y="140" width="812" height="64" rx="2" fill="rgba(0,229,255,0.03)" stroke="rgba(0,229,255,0.12)" stroke-width="1"/>
  <rect x="34" y="152" width="150" height="24" rx="2" fill="rgba(0,229,255,0.1)" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
  <text x="109" y="168" font-size="11" fill="#00e5ff" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700">sentence</text>
  <text x="109" y="192" font-size="9" fill="#475569" text-anchor="middle" font-family="JetBrains Mono,monospace">Fine-grained</text>
  <!-- how -->
  <text x="230" y="165" font-size="10" fill="#94a3b8" font-family="JetBrains Mono,monospace">Split on</text>
  <rect x="290" y="152" width="60" height="18" rx="2" fill="#0f172a" stroke="#1e2030" stroke-width="1"/>
  <text x="320" y="165" font-size="9.5" fill="#f59e0b" text-anchor="middle" font-family="JetBrains Mono,monospace">. ! ?</text>
  <text x="230" y="184" font-size="9" fill="#475569" font-family="JetBrains Mono,monospace">+ N sentences/chunk</text>
  <!-- count -->
  <text x="430" y="165" font-size="11" fill="#00e5ff" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700">~15–20 chunks</text>
  <rect x="380" y="172" width="100" height="6" rx="3" fill="#1e2030"/>
  <rect x="380" y="172" width="72" height="6" rx="3" fill="rgba(0,229,255,0.5)"/>
  <text x="430" y="192" font-size="9" fill="#475569" text-anchor="middle" font-family="JetBrains Mono,monospace">fine granularity</text>
  <!-- best for -->
  <text x="630" y="168" font-size="10" fill="#e2e8f0" font-family="JetBrains Mono,monospace">Dense prose</text>
  <text x="630" y="186" font-size="9" fill="#475569" font-family="JetBrains Mono,monospace">long paragraphs</text>

  <!-- ─── Row 3: Fixed Word ─── -->
  <rect x="24" y="212" width="812" height="64" rx="2" fill="rgba(124,58,237,0.03)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <rect x="34" y="224" width="150" height="24" rx="2" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="109" y="240" font-size="11" fill="#a78bfa" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700">fixed_word</text>
  <text x="109" y="264" font-size="9" fill="#475569" text-anchor="middle" font-family="JetBrains Mono,monospace">Baseline</text>
  <!-- how -->
  <text x="230" y="237" font-size="10" fill="#94a3b8" font-family="JetBrains Mono,monospace">Sliding window</text>
  <rect x="290" y="224" width="60" height="18" rx="2" fill="#0f172a" stroke="#1e2030" stroke-width="1"/>
  <text x="320" y="237" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="JetBrains Mono,monospace">N words</text>
  <text x="230" y="256" font-size="9" fill="#475569" font-family="JetBrains Mono,monospace">+ overlap</text>
  <!-- count -->
  <text x="430" y="237" font-size="11" fill="#a78bfa" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700">~25+ chunks</text>
  <rect x="380" y="244" width="100" height="6" rx="3" fill="#1e2030"/>
  <rect x="380" y="244" width="50" height="6" rx="3" fill="rgba(124,58,237,0.5)"/>
  <text x="430" y="264" font-size="9" fill="#ef4444" text-anchor="middle" font-family="JetBrains Mono,monospace">topic bleeding ⚠</text>
  <!-- best for -->
  <text x="630" y="240" font-size="10" fill="#e2e8f0" font-family="JetBrains Mono,monospace">Unstructured text</text>
  <text x="630" y="258" font-size="9" fill="#475569" font-family="JetBrains Mono,monospace">OCR / scraped data</text>

  <!-- Bottom label -->
  <text x="836" y="292" font-size="9" fill="#1e3a4a" text-anchor="end" letter-spacing="1" font-family="JetBrains Mono,monospace">RAG · Day 01</text>
</svg>
