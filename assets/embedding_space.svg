      <stop offset="0%" style="stop-color:#0d0d16"/>
      <stop offset="100%" style="stop-color:#111120"/>
    </linearGradient>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,229,255,0.04)" stroke-width="0.5"/>
    </pattern>
    <!-- radial glow for clusters -->
    <radialGradient id="glow_green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(16,185,129,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(16,185,129,0)"/>
    </radialGradient>
    <radialGradient id="glow_cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(0,229,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(0,229,255,0)"/>
